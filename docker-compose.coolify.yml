# DeskcommCRM v1.47.0 — deploy nativo no Coolify, com Supabase Cloud.
# No Coolify, publique SOMENTE o serviço gateway, na porta interna 8080.
# O proxy do Coolify cuida do domínio e do HTTPS.
services:
  bootstrap:
    networks: [private]
    build:
      context: .
      dockerfile: docker/coolify/Dockerfile.bootstrap
    restart: "no"
    exclude_from_hc: true
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      OWNER_EMAIL: ${OWNER_EMAIL:?}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?}
      OWNER_ORG_NAME: ${OWNER_ORG_NAME:-Minha Empresa}
      APP_LOCALE: ${APP_LOCALE:-pt-BR}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}

  app:
    networks: [private, gateway_net]
    image: ghcr.io/melgarafael/deskcommcrm:${DESKCOMM_VERSION:-1.47.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    environment: &deskcomm_env
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${APP_URL:?}
      NEXT_PUBLIC_ADMIN_URL: ${APP_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?}
      INTERNAL_SECRET: ${SERVICE_HEX_64_INTERNAL}
      INTERNAL_CRON_SECRET: ${SERVICE_HEX_64_INTERNAL}
      CPF_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_CPF}
      AI_CRED_AES_KEY: ${SERVICE_REALBASE64_32_AI_CRED}
      WAHA_BYO_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_WAHA_BYO}
      IMPERSONATE_COOKIE_SECRET: ${SERVICE_HEX_64_IMPERSONATE}
      LGPD_SIGNING_KEY: ${SERVICE_HEX_64_LGPD}
      WAHA_API_BASE_URL: http://waha:3000
      WAHA_WEBHOOK_BASE_URL: http://app:3000
      WAHA_API_KEY: ${SERVICE_HEX_64_WAHA}
      WAHA_HMAC_SECRET: ${SERVICE_HEX_64_WAHA_HMAC}
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SERVICE_HEX_64_SRH}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      SENTRY_DSN: "off"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    networks: [private]
    image: ghcr.io/melgarafael/deskcomm-worker:${DESKCOMM_VERSION:-1.47.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *deskcomm_env
      WAHA_API_BASE_URL: http://waha:3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  waha:
    networks: [private]
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      WAHA_API_KEY: ${SERVICE_HEX_64_WAHA}
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,message.edited,message.revoked,session.status,state.change
      WHATSAPP_HOOK_HMAC: ${SERVICE_HEX_64_WAHA_HMAC}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media

  redis:
    networks: [private]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    networks: [private]
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SERVICE_HEX_64_SRH}
      SRH_CONNECTION_STRING: redis://redis:6379

  scheduler:
    networks: [private]
    image: ghcr.io/melgarafael/deskcomm-scheduler:${DESKCOMM_VERSION:-1.47.0}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${SERVICE_HEX_64_INTERNAL}

  # O gateway bloqueia o webhook global do WAHA na internet. O WAHA chama o
  # app diretamente pela rede privada do Compose, sem passar pelo gateway.
  gateway:
    networks: [gateway_net]
    build:
      context: .
      dockerfile: docker/coolify/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  waha-data:
  waha-media:

networks:
  private:
  gateway_net:
